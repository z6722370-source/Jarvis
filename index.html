<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>NICK // JARVIS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#02070a;
    color:#00eaff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.jarvis{
    width:100%;
    max-width:600px;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

h1{
    font-size:42px;
    letter-spacing:10px;
    margin-bottom:8px;
    text-shadow:0 0 20px #00eaff;
}

.subtitle{
    color:#6c8990;
    font-size:13px;
    letter-spacing:3px;
    margin-bottom:35px;
}

.orb{
    width:180px;
    height:180px;
    border:3px solid #00eaff;
    border-radius:50%;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:
        0 0 20px #00eaff,
        inset 0 0 30px #00eaff;
    animation:pulse 2s infinite;
    margin-bottom:30px;
}

.orb::before,
.orb::after{
    content:"";
    position:absolute;
    border:1px solid #00eaff;
    border-radius:50%;
}

.orb::before{
    width:135px;
    height:135px;
}

.orb::after{
    width:85px;
    height:85px;
}

.orb-core{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#00eaff;
    box-shadow:0 0 30px #00eaff;
    z-index:2;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
        box-shadow:0 0 20px #00eaff,inset 0 0 30px #00eaff;
    }
    50%{
        transform:scale(1.04);
        box-shadow:0 0 45px #00eaff,inset 0 0 45px #00eaff;
    }
}

.status{
    color:#aaa;
    font-size:14px;
    margin-bottom:20px;
    min-height:20px;
}

.mic{
    width:80px;
    height:80px;
    border-radius:50%;
    border:2px solid #00eaff;
    background:#071419;
    color:#fff;
    font-size:30px;
    cursor:pointer;
    box-shadow:0 0 15px #00eaff;
    transition:.2s;
}

.mic:active{
    transform:scale(.92);
}

.mic.listening{
    background:#00eaff;
    color:#001014;
    box-shadow:0 0 40px #00eaff;
}

.output{
    width:100%;
    min-height:80px;
    margin-top:25px;
    padding:15px;
    border:1px solid #073f49;
    border-radius:12px;
    color:#00eaff;
    background:#031014;
    font-size:15px;
    line-height:1.5;
}

.user{
    color:#777;
    margin-bottom:8px;
}

.jarvisReply{
    color:#00eaff;
}

.time{
    position:absolute;
    top:20px;
    right:20px;
    color:#45666d;
    font-size:12px;
}

// SPEAK
function jarvisSpeak(text){

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(text);

        speech.rate = 0.9;
        speech.pitch = 0.8;
        speech.volume = 1;

        speechSynthesis.speak(speech);
    }
}

    showMessage("Thinking...");

    try {

        const response = await fetch("YOUR_BACKEND_URL", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: command
            })
        });

        const data = await response.json();

        const reply =
            data.reply || "I couldn't get a response.";

        showMessage(reply);
        jarvisSpeak(reply);

    } catch (error) {

        console.error("AI ERROR:", error);

            "AI connection failed.";

        jarvisSpeak(reply);
    }

// SPEECH RECOGNITION
const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;


    micBtn.addEventListener("click",()=>{

        try{

            recognition.start();

            micBtn.classList.add("listening");

            statusText.textContent =
                "LISTENING...";

        }
        catch(error){

            console.log(error);

        }

    });


    recognition.onresult = function(event){

        const command =
            event.results[0][0].transcript;

        userText.textContent =
            "You: " + command;

        processCommand(command);

    };


    recognition.onend = function(){

        micBtn.classList.remove("listening");

        statusText.textContent =
            "SYSTEM READY";

    };


    recognition.onerror = function(event){

        micBtn.classList.remove("listening");

        statusText.textContent =
            "VOICE ERROR";

        jarvisText.textContent =
            "Microphone or speech recognition error.";

        console.log(event.error);

    };

}
else{

    statusText.textContent =
        "VOICE NOT SUPPORTED";

    jarvisText.textContent =
        "Use a browser that supports Speech Recognition.";

}
